function upd(){let big,lab,fr,t,s,v,cards,n=S.reps.length+1,mx=S.m=='x',N=mx?1:cfg.sets;
document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m==cfg.m));
if(S.ph=='idle'){const m=cfg.m,r=ref(m);mx=m=='x';N=mx?1:cfg.sets;big=mx?'MAX':cfg.sets;lab=mx?'bitta urinish':'set tayyor';fr=0;t='PushUp Island';s='Tayyor';v='';
cards=cd(mx?'Oxirgi max':'Oxirgi',r.prev?r.prev.total+' ta':'—',r.prev?fd(r.prev.t):'hali yoʻq')+cd(mx?'Max rekord':'Rekord',nv(r.best)+(r.best!=null?' ta':''),mx?'bitta urinishda':`eng katta set: ${nv(bestSet())}`)}
else if(S.ph=='work'){const p=S.prev;big=S.cur;
if(mx){lab='Max · charchaguncha';fr=S.best?Math.min(S.cur/S.best,1):0;cards=cc('Rekord',S.cur,S.best,'rekord')+cc('Oxirgi max',S.cur,p?p.total:null)}
else{lab=`${n}-set / ${cfg.sets}`;fr=S.reps.length/cfg.sets;cards=cc(`${n}-set`,S.cur,p?p.reps[n-1]:null)+cc('Jami',tot(),p?p.total:null)}
t=mx?'Max':`${n}-set`;s=mx?`Rekord: ${nv(S.best)}`:'Bajaryapsiz';v=S.cur}
else if(S.ph=='rest'){const ms=S.end-Date.now(),left=Math.max(0,Math.ceil(ms/1000)),p=S.prev;fr=Math.max(0,Math.min(1,ms/1000/S.tot));big=fmt(left);lab='Dam olish';
cards=cd(`${n}-set`,'oldin: '+nv(p?p.reps[n-1]:null),'keyingi set')+cd('Jami',tot()+' ta','oldin: '+nv(p?p.total:null));t='Dam olish';s=`Keyingi: ${n}-set`;v=fmt(left)}
else{const T=sum(S.reps),p=S.prev;big=T;lab='ta jami';fr=1;t='Tugadi';s=mx?'Max':`${S.reps.length} set`;v=T+' ta';
const [x,g]=cmp(T,p?p.total:null);
cards=cd(mx?'Natija':'Jami',x,'oldin: '+nv(p?p.total:null),g)+(mx?cd('Rekord',S.rec?'Yangi rekord!':cmp(T,S.best)[0],'rekord: '+Math.max(T,S.best||0),S.rec):cc('Eng katta set',Math.max(...S.reps),S.bestSet,'rekord'))}
$('big').textContent=big;$('lab').textContent=lab;$('info').innerHTML=cards;
$('rp').style.strokeDashoffset=C*(1-(S.ph=='idle'?0:Math.max(fr,.015)));
$('ip').style.strokeDashoffset=S.ph=='idle'?'':56.55*(1-Math.max(fr,.03));
$('it').textContent=t;$('is').textContent=s;$('ir').textContent=v;
$('dots').innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<S.reps.length||S.ph=='done'?'d':i==S.reps.length&&S.ph=='work'?'c':''}"></i>`).join('')}
setInterval(()=>{if(S.ph!='rest')return;const l=Math.ceil((S.end-Date.now())/1000);if(l<=0)endRest(1);else{if(l<=3&&l!==S.lt){S.lt=l;beep(880,.1);buzz(20)}upd()}},250);
/* Push-up figure: ikki boʻgʻimli qoʻl (IK), gavda qattiq chiziq */
const FX=214,FY=88,HX=64,L=148,U=25,f1=$('f1'),f2=$('f2'),f3=$('f3'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function pose(h){const sx=FX-Math.sqrt(L*L-h*h),sy=FY-h,dx=sx-HX,dy=sy-FY,d=Math.hypot(dx,dy),a=Math.min(d/2,U-.01),k=Math.sqrt(U*U-a*a),ex=(HX+sx)/2-dy/d*k,ey=(FY+sy)/2+dx/d*k,tx=(sx-FX)/L,ty=(sy-FY)/L;
f1.setAttribute('x1',FX);f1.setAttribute('y1',FY-3);f1.setAttribute('x2',sx);f1.setAttribute('y2',sy);
f2.setAttribute('points',`${sx},${sy} ${ex},${ey} ${HX},${FY-1}`);f3.setAttribute('cx',sx+tx*20);f3.setAttribute('cy',sy+ty*20-2)}
(function loop(ts){const w=S.ph=='work';pose(w?29+15*Math.cos(ts/1000*2*Math.PI/1.9):43+1.2*Math.sin(ts/1000*2*Math.PI/4.2));if(!rm||!f1.getAttribute('x1'))requestAnimationFrame(loop)})(0);
/* Panellar */
function openS(k){$('pn').innerHTML=k=='s'?setH():hisH();$('sh').classList.add('o')}
function cs(){$('sh').classList.remove('o')}
const ph=t=>`<div class="ph"><h2>${t}</h2><button onclick="cs()" aria-label="Yopish">${I('x')}</button></div>`;
function setH(){const tg=k=>`<button class="tg ${cfg[k]?'on':''}" onclick="tgl('${k}')"></button>`,st=(k,d,v)=>`<span class="st"><button class="s" onclick="cf('${k}',-${d})">${I('minus')}</button><b>${v}</b><button class="s" onclick="cf('${k}',${d})">${I('plus')}</button></span>`;
return ph('Sozlamalar')+`<div class="r"><span>${I('layers')}Setlar soni</span>${st('sets',1,cfg.sets)}</div><div class="r"><span>${I('timer')}Dam olish (soniya)</span>${st('rest',5,cfg.rest)}</div><div class="r"><span>${I('vol')}Ovoz</span>${tg('snd')}</div><div class="r"><span>${I('vib')}Tebranish</span>${tg('vib')}</div><p class="mut" style="margin-top:12px">Mashq paytida ekran oʻchmaydi. Natijalar shu qurilmada saqlanadi.</p>`}
function cf(k,d){cfg[k]=k=='sets'?Math.min(10,Math.max(1,cfg[k]+d)):Math.min(300,Math.max(10,cfg[k]+d));sv('pi_cfg',cfg);$('pn').innerHTML=setH();upd()}
function tgl(k){cfg[k]=cfg[k]?0:1;sv('pi_cfg',cfg);$('pn').innerHTML=setH()}
function hisH(){const all=sum(hist.map(h=>h.total)),ss=hist.filter(h=>md(h)=='s'),bs=ss.length?ss.reduce((a,b)=>b.total>a.total?b:a):null,mxs=hist.filter(h=>md(h)=='x'),bm=mxs.length?Math.max(...mxs.map(h=>h.total)):null;
return ph('Tarix')+`<div class="sg">${cd('Barcha mashqlar jami',all+' ta',hist.length+' ta mashq')}${cd('Eng koʻp (setlarda)',bs?bs.total+' ta':'—',bs?bs.reps.length+' setda':'')}${cd('Eng koʻp bitta set',nv(bestSet()),'barcha mashqlar ichida')}${cd('Max rekord',bm==null?'—':bm+' ta','bitta urinishda')}</div>`+(hist.length?hist.map(h=>`<div class="hi"><div>${I(md(h)=='x'?'bolt':'layers')}<div><b>${h.total} ta</b><small>${fd(h.t)} · ${md(h)=='x'?'Max':h.reps.length+' set'}</small></div></div>${md(h)=='x'?'':`<div class="ch">${h.reps.map(n=>`<i>${n}</i>`).join('')}</div>`}</div>`).join('')+`<button class="b" style="margin-top:16px;width:100%;flex:none" onclick="clr(this)">${I('trash')}Tozalash</button>`:`<p class="mut" style="margin-top:14px">Hali natija yoʻq. Birinchi mashqni boshlang.</p>`)}
function clr(b){if(b.dataset.a){hist=[];sv('pi_h',hist);$('pn').innerHTML=hisH();upd()}else{b.dataset.a=1;b.lastChild.textContent='Oʻchirilsinmi? Yana bosing'}}
(function(){const p=document.createElement('div');p.style.cssText='position:fixed;top:0;height:env(safe-area-inset-top,0px)';document.body.appendChild(p);const h=p.offsetHeight;p.remove();const sa=navigator.standalone===true||matchMedia('(display-mode:standalone)').matches;if(!sa&&h>0)document.documentElement.classList.add('emb')})();
render();upd();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
